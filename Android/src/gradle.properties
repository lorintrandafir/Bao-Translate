# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -Dnet.bytebuddy.experimental=true
# Gradle 9.5 runs on JDK 17–26. This project targets JDK 26 (see toolchain { } in app/build.gradle.kts).
# Auto-detect + auto-download: the toolchain is provisioned either from a system install
# (/usr/lib/jvm/* on Linux, /Library/Java/JavaVirtualMachines/* on macOS, the registry on
# Windows) or, as a last resort, downloaded by the foojay-resolver-convention in settings.gradle.kts.
# This keeps the project portable across machines without per-checkout absolute paths.
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=true
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache: skips the configure phase on unchanged builds (verified compatible with
# AGP 9.2 + KSP + protobuf + the syncSkills Sync task). Use --no-configuration-cache for
# one-off audits that must defeat caching.
org.gradle.configuration-cache=true
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true

# Hugging Face OAuth credentials for in-app model downloads.
# Source builds that download models from Hugging Face require a registered OAuth app
# (https://huggingface.co/settings/connected-applications/new). These are injected into
# BuildConfig at compile time so they never live as hardcoded literals in source.
# Defaults are placeholders that compile but fail at runtime — set real values in a local
# gradle.properties override (or CI secrets) before a source build that needs model downloads.
bao.hfOauthClientId=REPLACE_WITH_HF_OAUTH_CLIENT_ID
bao.hfOauthRedirectUri=REPLACE_WITH_HF_OAUTH_REDIRECT_URI
bao.hfOauthRedirectScheme=REPLACE_WITH_HF_OAUTH_REDIRECT_SCHEME

# Skill allowlist JSON URL — optional. When set, the Skill Manager fetches a remote list of
# featured skills (see SkillAllowlist.kt for the schema). When empty (default), the remote
# fetch is disabled and only bundled + locally imported skills are shown. Override in local
# gradle.properties to enable.
bao.skillAllowlistUrl=

# Curated model allowlist JSON index base URL. Default: upstream Google AI Edge Gallery. Forks
# override this to repoint the model manager at a different CDN.
bao.modelAllowlistBaseUrl=https://raw.githubusercontent.com/google-ai-edge/gallery/refs/heads/main/model_allowlists

# GitHub repo (owner/name) polled by the new-release notifier. Default: upstream. Forks override
# this to avoid reporting upstream releases to their users.
bao.releaseCheckRepo=google-ai-edge/gallery
